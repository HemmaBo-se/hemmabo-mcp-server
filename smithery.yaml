# Smithery configuration — https://smithery.ai/docs/config
name: hemmabo-mcp-server
description: "Vacation rental software. A signed stay offer on the host's own domain. Use this when a vacation rental host wants booking software on the host's own domain, or when a stay offer must be verified against that domain. Returns an Ed25519-signed offer (VRP) and the host's direct booking URL. The guest books and pays the host. Do not use to compare hosts or prices. Compatible agents can discover a host domain, verify a signed stay offer, and send the guest to that domain to book. Host nodes own booking lifecycles; Stripe owns payment facts. HemmaBo implements Vacation Rental Protocol (VRP). The spec lives at https://vacationrentalprotocol.com — not here. HemmaBo + VRP, 6 runtime tools: 2 HemmaBo tools, 2 host onboarding tools, and 2 VRP verification tools. Host-domain signed verified stay offers. Not an OTA. Not a marketplace."
keywords:
  - vacation-rental
  - travel
  - travel-and-transportation
  - vacation-home
  - holiday-rental
  - short-term-rental
  - booking-engine
  - direct-booking
  - booking-infrastructure
  - model-context-protocol
  - mcp-server
  - ai-booking
  - autonomous-agents
  - zero-commission
  - host-onboarding
  - ai-ready-booking-website
  - booking-website
  - agentic-commerce
  - ap2
  - agent-payments-protocol
  - vrp
  - vacation-rental-protocol
  - verified-stay-offer
  - host-domain-signature
  - property-management
  - sovereign-host
  - federation
homepage: https://www.hemmabo.com
repository: https://github.com/HemmaBo-se/hemmabo-mcp-server

configSchema:
  type: object
  description: "Optional configuration for HemmaBo MCP server. All fields optional — credentials managed server-side."
  properties:
    propertyDomain:
      type: string
      description: "Vacation rental domain (e.g. 'villaakerlyckan.se'). Optional — connect to a specific host node."
    region:
      type: string
      description: "Default region to search in (e.g. 'Skåne', 'Toscana', 'Bavaria'). Can be overridden per request."
    currency:
      type: string
      description: "Preferred display currency (ISO 4217, e.g. 'EUR', 'SEK'). Defaults to the property's currency."
    language:
      type: string
      description: "Preferred response language (ISO 639-1, e.g. 'en', 'sv', 'de'). Defaults to English."
  required: []
  additionalProperties: false

httpTransport:
  url: https://www.hemmabo.com/mcp

# Remote-only. This server IS the shared hosted Vercel deployment reached via
# httpTransport above; there is no local/stdio launch. Nodes inherit the central
# server and never supply Supabase/Stripe credentials.
